<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Study Calendar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"Noto Sans KR","Noto Sans JP","Noto Sans SC",Roboto,sans-serif}
body{background:#fff;color:#202124;max-width:480px;margin:auto;height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:4px;padding:12px 10px;border-bottom:1px solid #eee}
header h1{font-size:19px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{border:none;background:none;font-size:22px;padding:4px 10px;border-radius:20px;cursor:pointer}
#today{font-size:13px;border:1px solid #dadce0}#set{font-size:18px}
main{flex:1;overflow:auto;padding-bottom:80px}
.view{display:none}.view.show{display:block}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:#70757a;padding:6px 0}
.wk span:first-child{color:#d93025}.wk span:last-child{color:#1a73e8}
#grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid #eee}
.cell{min-height:74px;border-right:1px solid #f1f1f1;border-bottom:1px solid #f1f1f1;padding:2px;overflow:hidden;cursor:pointer}
.cell.out{opacity:.35}.cell.sel{background:#e8f0fe}
.n{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;font-size:12px;border-radius:50%}
.n.sun{color:#d93025}.n.sat{color:#1a73e8}.n.today{background:#1a73e8;color:#fff}
.chip{font-size:10px;color:#fff;border-radius:3px;padding:1px 3px;margin-top:1px;white-space:nowrap;overflow:hidden}
.more{font-size:10px;color:#70757a}
#agenda{padding:14px}#agenda h3{font-size:15px;margin-bottom:8px}
.item{display:flex;gap:10px;padding:10px;border-radius:10px;background:#f8f9fa;margin-bottom:6px;cursor:pointer}
.item.gap{background:#fffdf5;border:1.5px dashed #f6bf26}
.item .prog{margin-top:6px}
.bar{width:4px;border-radius:2px;flex-shrink:0}
.item small,.word small{display:block;color:#70757a;font-size:12px;margin-top:2px}
.dd{color:#d93025;font-weight:700;font-size:12px;margin-left:6px}
.due{background:#fef7e0;color:#b06000;padding:10px;border-radius:10px;margin-bottom:8px;cursor:pointer}
.empty{color:#9aa0a6;text-align:center;padding:30px 0;font-size:14px}
.seg{display:flex;gap:6px;padding:10px 14px;overflow-x:auto}
.seg button{border:1px solid #dadce0;background:#fff;border-radius:16px;padding:6px 14px;font-size:13px;white-space:nowrap;cursor:pointer}
.seg button.on{background:#e8f0fe;border-color:#1a73e8;color:#1a73e8}
.seg small{opacity:.6}
.tt{display:grid;grid-template-columns:34px repeat(7,1fr);padding:0 6px}
.tt .hd{text-align:center;font-size:12px;padding:6px 0;color:#70757a}.tt .hd.td{color:#1a73e8;font-weight:700}
.tcol{position:relative;border-left:1px solid #eee;background:repeating-linear-gradient(#fff 0 43px,#eee 43px 44px)}
.tcol.td{background:repeating-linear-gradient(#f4f8ff 0 43px,#e3e9f5 43px 44px)}
.hr{height:44px;font-size:10px;color:#9aa0a6;text-align:right;padding-right:4px}
.blk{position:absolute;left:1px;right:1px;border-radius:4px;color:#fff;font-size:10px;padding:2px;overflow:hidden;cursor:pointer;line-height:1.2}
#noteList{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
.card{border-radius:12px;overflow:hidden;background:#f8f9fa;cursor:pointer}
.card img{width:100%;height:120px;object-fit:cover;display:block}.card div{padding:8px;font-size:12px}
.badge{display:inline-block;background:#1a73e8;color:#fff;border-radius:8px;padding:1px 6px;font-size:11px;margin-right:4px}
.vbar{display:flex;gap:8px;padding:0 14px 10px;align-items:center}
#wq{flex:1;min-width:0;padding:10px 14px;border:1px solid #dadce0;border-radius:24px;font-size:15px;background:#f1f3f4}
.mini{border:1px solid #dadce0;background:#fff;border-radius:20px;padding:8px 12px;font-size:13px;white-space:nowrap;cursor:pointer;align-self:stretch}
#wordList{padding:0 14px}
.word{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:10px;background:#f8f9fa;margin-bottom:6px;cursor:pointer}
.word b{font-size:16px}
.spk{border:none;background:none;font-size:16px;cursor:pointer;vertical-align:middle}
.wcard{font-size:34px;font-weight:700;text-align:center;padding:50px 10px;background:#f1f3f4;border-radius:12px;margin:10px 0;word-break:break-word}
.wcard.mc{font-size:20px;font-weight:500;line-height:1.7;padding:30px 10px}
.tin{width:100%;padding:14px;border:2px solid #1a73e8;border-radius:12px;font-size:20px;text-align:center}
.stat{display:flex;gap:10px}
.stat div{flex:1;background:#f8f9fa;border-radius:12px;padding:14px;text-align:center;font-size:13px;color:#70757a}
.stat b{display:block;font-size:28px;color:#1a73e8}
.info{color:#70757a;margin:12px 0;font-size:13px;line-height:1.5}
.lbl{font-size:13px;color:#5f6368;margin:14px 0 6px;font-weight:600}
#rv{padding:16px}#rv .seg{padding:0}
#rv select{width:100%;padding:10px;border:1px solid #dadce0;border-radius:10px;font-size:14px}
.big{width:100%;border-radius:12px;margin:10px 0;max-height:50vh;object-fit:contain;background:#f1f3f4}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;margin-top:8px;cursor:pointer}
.btn:disabled{opacity:.4}
.pri{background:#1a73e8;color:#fff}.sec{background:#f1f3f4}.bad{background:#fce8e6;color:#c5221f}.good{background:#e6f4ea;color:#137333}
.ans{background:#e8f0fe;padding:14px;border-radius:12px;margin-top:8px;line-height:1.6}
.prog{height:4px;background:#eee;border-radius:2px}.prog i{display:block;height:100%;background:#1a73e8;border-radius:2px}
#fab{position:fixed;right:max(20px,calc(50% - 220px));bottom:84px;width:56px;height:56px;border-radius:16px;border:none;background:#c2e7ff;font-size:28px;box-shadow:0 2px 6px #0003;cursor:pointer}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:#f3f6fc;border-top:1px solid #eee}
nav button{flex:1;min-width:0;border:none;background:none;padding:8px 0 10px;font-size:10px;color:#444;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav i{display:block;font-style:normal;font-size:20px;width:48px;margin:0 auto 2px;border-radius:16px;padding:2px 0}
nav button.on i{background:#c2e7ff}
nav b{position:absolute;top:4px;right:calc(50% - 22px);background:#d93025;color:#fff;font-size:10px;border-radius:8px;padding:0 5px}
#dim{position:fixed;inset:0;background:#0005;display:none}#dim.open{display:block}
#sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;background:#fff;border-radius:20px 20px 0 0;padding:20px;transform:translate(-50%,100%);transition:.25s;max-height:90dvh;overflow:auto}
#sheet.open{transform:translate(-50%,0)}
#sheet h3{margin-bottom:12px}
#sheet input,#sheet select,#sheet textarea{width:100%;padding:12px;border:1px solid #dadce0;border-radius:10px;font-size:15px;margin-bottom:8px}
#sheet label{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:15px}
#sheet label input{width:20px;height:20px;margin:0}
.row{display:flex;gap:8px}
.colors{display:flex;gap:10px;margin:6px 0 12px}
.colors span{width:26px;height:26px;border-radius:50%;cursor:pointer}
.colors span.on{outline:3px solid #202124;outline-offset:2px}
.btns{display:flex;gap:8px}.btns button{flex:1}
.lgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lgs button{padding:12px;border:1px solid #dadce0;border-radius:10px;background:#fff;font-size:15px;cursor:pointer}
.lgs .on{border-color:#1a73e8;background:#e8f0fe;color:#1a73e8}
#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{display:block;max-width:none;height:auto}
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000}
  .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:12px;font-size:13px}
  .ph h2,.pa h2{font-size:18px}
  .pg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .pq{break-inside:avoid;border:1px solid #bbb;border-radius:6px;padding:8px}
  .pq img{display:block;width:100%;max-height:85mm;object-fit:contain;margin-top:4px}
  .sp{height:28mm}
  .pa{break-before:page}
  .pa h2{border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
  .pa li{margin:0 0 6px 22px;font-size:13px}
}
</style>
</head>
<body>
<header>
  <button id="prev">‹</button><h1 id="title"></h1><button id="next">›</button>
  <button id="today" data-i="today"></button><button id="set">⚙️</button>
</header>
<main>
  <section id="v-cal" class="view show"><div class="wk" id="wk"></div><div id="grid"></div><div id="agenda"></div></section>
  <section id="v-tt" class="view">
    <div class="seg" id="ttFilter">
      <button data-f="all" class="on" data-i="all"></button>
      <button data-f="school">🏫 <span data-i="school"></span></button>
      <button data-f="academy">📚 <span data-i="academy"></span></button>
    </div>
    <div id="ttGrid"></div>
  </section>
  <section id="v-notes" class="view">
    <div class="vbar" style="padding-top:10px"><div class="seg" id="subFilter" style="flex:1;min-width:0;padding:0"></div><button class="mini" id="printBtn" data-i="print"></button></div>
    <div id="noteList"></div>
  </section>
  <section id="v-vocab" class="view">
    <div class="seg" id="fdBar"></div>
    <div class="vbar"><input id="wq" type="search" autocapitalize="off"><button class="mini" id="bulkBtn" data-i="bulk"></button></div>
    <div id="wordList"></div>
  </section>
  <section id="v-review" class="view"><div id="rv"></div></section>
</main>
<button id="fab">+</button>
<nav>
  <button data-v="cal" class="on"><i>📅</i><span data-i="cal"></span></button>
  <button data-v="tt"><i>🗓️</i><span data-i="tt"></span></button>
  <button data-v="notes"><i>📷</i><span data-i="notes"></span></button>
  <button data-v="vocab"><i>🔤</i><span data-i="vocab"></span></button>
  <button data-v="review"><i>🧠</i><span data-i="review"></span><b id="badge" hidden></b></button>
</nav>
<div id="dim"></div><div id="sheet"></div>
<div id="print"></div>
<input type="file" id="file" accept="image/*" capture="environment" hidden>

/* ================= IndexedDB ================= */
const DB={db:null,
  open:()=>new Promise((ok,no)=>{const r=indexedDB.open('study-cal',1);
    r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('imgs')};
    r.onsuccess=()=>{DB.db=r.result;ok()};r.onerror=()=>no(r.error)}),
  run:(st,mode,fn)=>new Promise((ok,no)=>{const t=DB.db.transaction(st,mode),q=fn(t.objectStore(st));
    t.oncomplete=()=>ok(q.result);t.onerror=t.onabort=()=>no(t.error)}),
  get:(st,k)=>DB.run(st,'readonly',s=>s.get(k)),
  put:(st,k,v)=>DB.run(st,'readwrite',s=>s.put(v,k)),
  del:(st,k)=>DB.run(st,'readwrite',s=>s.delete(k)),
  allImgs:()=>new Promise(ok=>{const m={},r=DB.db.transaction('imgs').objectStore('imgs').openCursor();
    r.onsuccess=()=>{const c=r.result;if(c){m[c.key]=URL.createObjectURL(c.value);c.continue()}else ok(m)}})
};

/* ================= 시간 분석 (자투리/플래너 공용) ================= */
const H0=8,H1=22,PX=44,ORDER=[1,2,3,4,5,6,0];
function busy(k){
  const wd=new Date(k+'T00:00').getDay();
  const b=[...S.tt.filter(t=>t.day===wd).map(t=>[toMin(t.start),toMin(t.end)]),
    ...S.events.filter(e=>e.date===k&&e.time).map(e=>{const s=toMin(e.time);return[s,e.end&&toMin(e.end)>s?toMin(e.end):s+60]})]
    .sort((a,b)=>a[0]-b[0]);
  const m=[];b.forEach(x=>{const l=m[m.length-1];if(l&&x[0]<=l[1])l[1]=Math.max(l[1],x[1]);else m.push([...x])});
  return m;
}
const gaps=k=>{const b=busy(k),g=[];for(let i=1;i<b.length;i++){if(b[i][0]-b[i-1][1]>=15)g.push([b[i-1][1],b[i][0]])}return g};
const freeMin=k=>{let c=H0*60,f=0;busy(k).forEach(([s,e])=>{s=Math.max(s,H0*60);e=Math.min(e,H1*60);if(e>c){f+=Math.max(0,s-c);c=e}});return f+Math.max(0,H1*60-c)};
function curClass(){
  const d=new Date(),wd=d.getDay(),m=d.getHours()*60+d.getMinutes(),l=S.tt.filter(t=>t.day===wd);
  return l.find(t=>toMin(t.start)<=m&&m<toMin(t.end))
    ||l.filter(t=>m>=toMin(t.end)&&m-toMin(t.end)<=10).sort((a,b)=>toMin(b.end)-toMin(a.end))[0];
}
/* 시험 플래너 */
const exams=()=>S.events.filter(e=>e.kind==='exam');
const done=x=>Object.values(x.log||{}).reduce((a,b)=>a+b,0);
function target(x,k){
  const t=TODAY(); if(!x.goal||k<t||k>=x.date)return 0;
  const days=[]; for(let d=t;d<x.date&&days.length<120;d=addDays(d,1))days.push(d);
  const n=days.length, w=days.map((d,i)=>(freeMin(d)+30)*(1+i/n)), sw=w.reduce((a,b)=>a+b,0);
  const before=Object.entries(x.log||{}).filter(([d])=>d<t).reduce((a,[,m])=>a+m,0);
  const need=Math.max(0,x.goal*60-before), i=days.indexOf(k);
  return i<0?0:Math.round(need*w[i]/sw/5)*5;
}
const soonSubs=()=>{const t=TODAY(),l=addDays(t,7);return new Set(exams().filter(e=>e.date>=t&&e.date<=l).map(e=>e.sub))};
const prio=list=>{const s=soonSubs();return [...list].sort((a,b)=>(b.k==='note'&&s.has(b.r.subject))-(a.k==='note'&&s.has(a.r.subject)))};
/* 자투리 복습량: 오답 약 3분, 단어 약 30초 */
function gapPlan(min,k){
  const n=prio(S.notes.filter(x=>x.due<=k).map(r=>({k:'note',r}))), w=S.words.filter(x=>x.due<=k).map(r=>({k:'word',r}));
  const nN=Math.min(n.length,Math.floor(min/6)), nW=Math.min(w.length,Math.floor((min-nN*3)*2));
  return {nN,nW,q:[...n.slice(0,nN),...w.slice(0,nW)]};
}

function renderCal(){
  const y=cur.getFullYear(), m=cur.getMonth(), t=TODAY();
  $('#title').textContent=cur.toLocaleDateString(LOC(),{year:'numeric',month:'long'});
  $('#wk').innerHTML=[0,1,2,3,4,5,6].map(d=>`<span>${dayN(d)}</span>`).join('');
  const s=new Date(y,m,1-new Date(y,m,1).getDay());
  let h='';
  for(let i=0;i<42;i++){
    const d=new Date(s.getFullYear(),s.getMonth(),s.getDate()+i), k=ymd(d), dw=d.getDay();
    const ev=S.events.filter(e=>e.date===k);
    h+=`<div class="cell ${d.getMonth()!==m?'out':''} ${k===sel?'sel':''}" data-d="${k}">
      <span class="n ${k===t?'today':''} ${dw==0?'sun':dw==6?'sat':''}">${d.getDate()}</span>
      ${ev.slice(0,3).map(e=>`<div class="chip" style="background:${e.color}">${e.kind==='exam'?'📝':''}${esc(e.title)}</div>`).join('')}
      ${ev.length>3?`<div class="more">+${ev.length-3}</div>`:''}</div>`;
  }
  $('#grid').innerHTML=h;
  $$('.cell').forEach(c=>c.onclick=()=>{sel=c.dataset.d;renderCal()});
  renderAgenda();
}
function renderAgenda(){
  const d=new Date(sel+'T00:00'), wd=d.getDay(), td=TODAY();
  const items=[
    ...S.events.filter(e=>e.date===sel).map(e=>({...e,k:'ev',kind:e.kind==='exam'?'📝 '+L('kindExam'):L('event'),start:e.time||''})),
    ...S.tt.filter(t=>t.day===wd).map(t=>({...t,k:'tt',kind:t.type==='school'?'🏫 '+L('school'):'📚 '+L('academy')}))];
  if(sel>=td)gaps(sel).forEach(([s,e])=>items.push({k:'gap',start:fromMin(s),end:fromMin(e),min:e-s}));
  items.sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  const plans=sel>=td?exams().filter(x=>x.date>sel).sort((a,b)=>a.date.localeCompare(b.date)):[];
  const due=sel===td?dueCount():0;
  const row=i=>{
    if(i.k==='gap'){const p=gapPlan(i.min,sel);
      return `<div class="item gap" data-k="gap" data-m="${i.min}"><div class="bar" style="background:#f6bf26"></div>
        <div><b>⏳ ${L('gap')} · ${dur(i.min)}</b><small>${i.start}~${i.end} · ${p.q.length?L('gapText',p.nW,p.nN):L('gapFree')}</small></div></div>`}
    return `<div class="item" data-k="${i.k}" data-id="${i.id}"><div class="bar" style="background:${i.color}"></div>
      <div><b>${esc(i.title)}</b><small>${i.kind}${i.start?' · '+i.start:''}${i.end?'~'+i.end:''}${i.place?' · '+esc(i.place):''}</small></div></div>`;
  };
  const planRow=x=>{

function compress(file){
  return new Promise(r=>{const img=new Image();img.onload=()=>{
    const sc=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(img.src);c.toBlob(r,'image/jpeg',.75);};img.src=URL.createObjectURL(file);});
}

      ${S.folders.length?`<p class="lbl">📁 ${L('folder')}</p><select id="rvFd"><option value="all">${L('all')}</option>${folderOpts('')}</select>`:''}
      <p class="info">${L('rvInfo')}</p>
      ${bt('sa',L('startAll'),'pri',dn.length+dw.length)}
      ${ex.map(([s,l],i)=>bt('ex'+i,L('examPrio',subName(s),l.length),'good',1)).join('')}
      ${bt('sn',L('startNotes'),'sec',dn.length)}${bt('sw',L('startWords'),'sec',dw.length)}${bt('rnd',L('random'),'sec',allItems(rvFd).length)}`;
    $$('#modeSeg button').forEach(b=>b.onclick=()=>{S.rvMode=b.dataset.m;save();renderReview()});
    if($('#rvFd')){$('#rvFd').value=rvFd;$('#rvFd').onchange=e=>{rvFd=e.target.value;renderReview()}}
    $('#sa').onclick=()=>start([...dn,...dw]);
    ex.forEach(([s,l],i)=>$('#ex'+i).onclick=()=>start(l.map(r=>({k:'note',r}))));
    $('#sn').onclick=()=>start(dn);
    $('#sw').onclick=()=>start(dw);
    $('#rnd').onclick=()=>start(shuffle(allItems(rvFd)).slice(0,10));
    return;
  }
  if(qi>=queue.length){
    rv.innerHTML=`<div class="empty" style="font-size:18px">${L('done',queue.length)}</div><button class="btn pri" id="bk">${L('back')}</button>`;
    $('#bk').onclick=()=>{queue=null;render()};return;
  }
  const {k,r,m}=queue[qi];
  let body, ans, ctrl;
  if(k==='note'){
    body=`<img class="big" src="${IMG[r.id]||''}"><p>📝 ${esc(r.memo)}</p>`;
    ans=`✅ ${L('answer')}: ${esc(r.answer)||'-'}`;
  }else{
    const means=r.means.map((x,i)=>`${i+1}. ${esc(x)}`).join('<br>');
    const wd=`${esc(r.word)} <button class="spk" data-w="${esc(r.word)}">🔊</button>`;
    body=m==='flash'?`<div class="wcard">${wd}</div>`:`<div class="wcard mc">${means}</div>`;
    ans=m==='flash'?means:`<b style="font-size:22px">${wd}</b>`;
  }
  if(m==='type'){
    ctrl=typed?`<div class="ans">${typed.ok?L('correct'):`${L('incorrect')} · ${L('yourAns')}: ${esc(typed.v)||'-'}`}<br>${ans}</div>
        <button class="btn ${typed.ok?'good':'bad'}" id="nx">${L('next')}</button>`
      :`<input id="ty" class="tin" placeholder="${L('typePh')}" autocapitalize="off" autocomplete="off" spellcheck="false">
        <button class="btn pri" id="ck">${L('check')}</button>`;
  }else{
    ctrl=shown?`<div class="ans">${ans}</div>
        <div class="btns"><button class="btn bad" id="ng">${L('wrong')}</button><button class="btn good" id="ok">${L('right')}</button></div>`
      :`<button class="btn pri" id="sh">${L('show')}</button>`;
  }
  rv.innerHTML=`<div class="prog"><i style="width:${qi/queue.length*100}%"></i></div>
    <p style="margin-top:10px"><span class="badge">${k==='note'?subName(r.subject):'🔤 '+L('modes')[m]}</span> ${qi+1} / ${queue.length}</p>
    ${body}${ctrl}<button class="btn sec" id="qt">${L('quit')}</button>`;
  $$('#rv .spk').forEach(b=>b.onclick=()=>speak(b.dataset.w));
  const check=()=>{const val=$('#ty').value;typed={v:val,ok:norm(val)===norm(r.word)};if(typed.ok)speak(r.word);renderReview()};
  if($('#ty')){$('#ty').onkeydown=e=>{if(e.key==='Enter')check()};setTimeout(()=>$('#ty')&&$('#ty').focus(),50)}
  $('#ck')&&($('#ck').onclick=check);
  $('#nx')&&($('#nx').onclick=()=>grade(typed.ok));
  $('#sh')&&($('#sh').onclick=()=>{shown=true;renderReview()});
  $('#ok')&&($('#ok').onclick=()=>grade(true));
  $('#ng')&&($('#ng').onclick=()=>grade(false));
  $('#qt').onclick=()=>{queue=null;render()};
}
function start(list){
  const pick=()=>S.rvMode==='mix'?['flash','rev','type'][Math.random()*3|0]:S.rvMode;
  queue=prio(list).map(x=>({...x,m:x.k==='word'?pick():''}));
  qi=0;shown=false;typed=null;renderReview();
}
function grade(ok){
  const n=queue[qi].r, t=TODAY();
  if(ok){n.ok++;n.due=addDays(t,IV[Math.min(n.level,IV.length-1)]);n.level=Math.min(n.level+1,5)}
  else{n.ng++;n.level=0;n.due=addDays(t,1)}
  save();qi++;shown=false;typed=null;render();
}

/* ================= 시작 ================= */
$('#fab').onclick=()=>({cal:()=>eventForm(),tt:()=>ttForm(),notes:()=>$('#file').click(),vocab:()=>wordForm()})[view]();
$$('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
(async()=>{
  try{
    await DB.open();
    let st=await DB.get('kv','state');
    const old=localStorage.getItem(KEY);
    if(!st&&old){
      st=JSON.parse(old);
      for(const n of st.notes||[]) if(n.img){await DB.put('imgs',n.id,await (await fetch(n.img)).blob());delete n.img}
    }
    Object.assign(S,st||{});
    S.notes.forEach(n=>n.subject=LEGACY[n.subject]||n.subject);
    S.words.forEach(w=>{w.folder??=''});
    S.events.forEach(e=>{e.kind??='event'});
    await DB.put('kv','state',S);
    if(old)localStorage.removeItem(KEY);
    IMG=await DB.allImgs();
    navigator.storage?.persist?.();
  }catch(e){alert('IndexedDB error: '+e.message)}
  applyLang(); go('cal');
})();
</script>

/* ---------- 앞으로 2주 알림 계획 (복습량을 날짜별로 미리 계산) ---------- */
const dueOn=k=>S.notes.filter(n=>n.due<=k).length+S.words.filter(w=>w.due<=k).length;
function plan(){
  const c=cfg(), now=new Date(), out=[], [h,m]=c.time.split(':').map(Number);
  for(let i=0;i<14;i++){
    const d=new Date();d.setDate(d.getDate()+i);d.setHours(h,m,0,0);const k=ymd(d);
    const add=(at,title,body)=>at>now&&out.push({at,title,body});
    if(c.on){const n=dueOn(k);if(n)add(d,'🧠 Study Calendar',L('rvMsg',n))}
    if(c.exam)exams().forEach(x=>{
      const dd=Math.round((new Date(x.date+'T00:00')-new Date(k+'T00:00'))/864e5);
      if([7,3,1,0].includes(dd)){const a=new Date(d);if(!dd)a.setHours(7,0,0,0);add(a,'📝 '+x.title,L('exMsg',dday(x.date,k)))}
    });
  }
  return out;
}

  if(NATIVE)return (await P.LocalNotifications.requestPermissions()).display==='granted';
  if(!('Notification' in window))return false;
  return (await Notification.requestPermission())==='granted';
}
async function schedule(){
  if(!NATIVE||!P.LocalNotifications)return;
  const LN=P.LocalNotifications;
  try{
    const {notifications:p}=await LN.getPending();
    if(p.length)await LN.cancel({notifications:p.map(x=>({id:x.id}))});
    if((await LN.checkPermissions()).display!=='granted')return;
    const list=plan().slice(0,60).map((x,i)=>({id:1000+i,title:x.title,body:x.body,schedule:{at:x.at,allowWhileIdle:true}}));
    if(list.length)await LN.schedule({notifications:list});
  }catch(e){console.warn(e)}
}

  if(!swReg?.periodicSync)return;

      const data=(await b2d(await (await fetch(a.href)).blob())).split(',')[1];

    }catch(err){console.warn(err)}
  },true);
  // 발음 듣기: WebView에는 음성합성이 없음 → TTS 플러그인으로 대체

  window.print=()=>alert(L('noPrint'));
}

 copied:'コピーしました! 一括入力に貼り付けできます。',working:'⏳ 処理中...'},
zh:{backup:'备份 / 恢复',exportB:'📤 创建备份文件',importB:'📥 从备份恢复',lastBk:d=>`上次备份: ${d}`,never:'尚未备份',
 daysAgo:n=>n?`${n}天前`:'今天',bkWarn:'⚠️ 已超过7天未备份。更换设备或清除浏览器数据可能导致数据丢失。',
 bkDone:n=>`备份已保存 (含 ${n} 张照片)。请查看下载文件夹。`,badFile:'不是有效的备份文件。',
 impTitle:'恢复备份',impInfo:(d,e,n,w)=>`${d} 的备份 · 日程 ${e} · 错题 ${n} · 单词 ${w}`,merge:'➕ 合并 (保留现有数据)',
 replace:'♻️ 覆盖 (删除现有数据)',impConfirm:'现有数据将全部被备份替换。是否继续?',
 impDone:(e,n,w)=>`恢复完成! 日程 ${e} · 错题 ${n} · 单词 ${w}`,wordsTxt:'📋 导出单词为文本',copy:'复制',
 copied:'已复制! 可粘贴到批量导入中。',working:'⏳ 处理中...'}
};
Object.keys(T5).forEach(k=>Object.assign(T[k],T5[k]));

/* ---------- 유틸 ---------- */
const LISTS=['events','tt','notes','words','folders'];
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const allBlobs=()=>new Promise((ok,no)=>{const m={},q=DB.db.transaction('imgs').objectStore('imgs').openCursor();
  q.onsuccess=()=>{const c=q.result;if(c){m[c.key]=c.value;c.continue()}else ok(m)};q.onerror=()=>no(q.error)});
const daysSince=d=>d?Math.round((new Date(TODAY()+'T00:00')-new Date(d+'T00:00'))/864e5):Infinity;
const needBk=()=>S.events.length+S.tt.length+S.notes.length+S.words.length>0&&daysSince(S.lastBackup)>7;
const busyBtn=id=>{const b=$('#'+id);if(b){b.disabled=true;b.textContent=L('working')}};
function download(file){
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}

/* ---------- 백업 ---------- */
async function exportBk(){
  busyBtn('bk-ex');
  try{
    const blobs=await allBlobs(), imgs={};
    for(const n of S.notes) if(blobs[n.id]) imgs[n.id]=await b2d(blobs[n.id]);
    const data={app:'study-calendar',ver:5,date:new Date().toISOString(),state:S,imgs};
    download(new File([JSON.stringify(data)],`study-calendar-backup-${TODAY()}.json`,{type:'application/json'}));
    S.lastBackup=TODAY(); await save();
    alert(L('bkDone',Object.keys(imgs).length));
  }catch(e){alert(L('storageFull')+' '+e.message)}
  closeSheet(); render();
}

/* ---------- 복원 ---------- */
const pick=document.createElement('input'); pick.type='file'; pick.accept='.json,application/json';
pick.onchange=async()=>{
  const f=pick.files[0]; pick.value=''; if(!f)return;
  let d=null; try{d=JSON.parse(await f.text())}catch(e){}
  if(!d||d.app!=='study-calendar'||!d.state)return alert(L('badFile'));
  importSheet(d);
};
function importSheet(d){
  const c=k=>(d.state[k]||[]).length;
  sheet(`<h3>📥 ${L('impTitle')}</h3>
    <p class="info">${L('impInfo',esc((d.date||'').slice(0,10)),c('events'),c('notes'),c('words'))}</p>
    <button class="btn pri" id="im-m">${L('merge')}</button>
    <button class="btn bad" id="im-r">${L('replace')}</button>`,()=>{
    $('#im-m').onclick=()=>doImport(d,false);
    $('#im-r').onclick=()=>confirm(L('impConfirm'))&&doImport(d,true);
  });
}
async function doImport(d,replace){
  busyBtn('im-m'); busyBtn('im-r');
  try{
    const st=d.state, imgs=d.imgs||{}, add={}, next={};
    LISTS.forEach(k=>{
      const src=(st[k]||[]).filter(x=>x&&x.id);
      if(replace){add[k]=src;next[k]=[...src]}
      else{const ids=new Set(S[k].map(x=>x.id));add[k]=src.filter(x=>!ids.has(x.id));next[k]=[...S[k],...add[k]]}
    });
    // 사진 먼저 저장 (실패 시 기존 데이터 보존)
    for(const n of add.notes) if(imgs[n.id]) await DB.put('imgs',n.id,await (await fetch(imgs[n.id])).blob());
    Object.assign(S,next);
    if(replace){if(st.lang)S.lang=st.lang;if(st.rvMode)S.rvMode=st.rvMode}
    S.notes.forEach(n=>n.subject=LEGACY[n.subject]||n.subject);
    S.words.forEach(w=>{w.folder??=''}); S.events.forEach(e=>{e.kind??='event'});
    await DB.put('kv','state',S);
    if(replace){ // 쓰지 않는 사진 정리
      const keep=new Set(S.notes.map(n=>n.id)), ks=await DB.run('imgs','readonly',s=>s.getAllKeys());
      for(const k of ks) if(!keep.has(k)) await DB.del('imgs',k);
    }
    Object.values(IMG).forEach(u=>URL.revokeObjectURL(u)); IMG=await DB.allImgs();
    queue=null; fdF='all'; rvFd='all';
    closeSheet(); applyLang(); render();
    alert(L('impDone',add.events.length,add.notes.length,add.words.length));
  }catch(e){alert(L('badFile')+' '+e.message);closeSheet()}
}

/* ---------- 단어장 텍스트 내보내기 ---------- */
function wordsText(){
  const txt=S.words.filter(w=>fdF==='all'||w.folder===fdF).map(w=>`${w.word} - ${w.means.join(', ')}`).join('\n');
  sheet(`<h3>${L('wordsTxt')}</h3><textarea id="w-tx" rows="12" readonly>${esc(txt)}</textarea>
    <button class="btn pri" id="w-cp">${L('copy')}</button>`,()=>{
    $('#w-cp').onclick=async()=>{const t=$('#w-tx');
      try{await navigator.clipboard.writeText(t.value)}catch(e){t.select();document.execCommand('copy')}
      alert(L('copied'))};
  });
}

/* ---------- 설정 화면 확장 + 알림 점 ---------- */
const baseSettings=settings;
settings=function(){
  baseSettings();
  const d=daysSince(S.lastBackup);
  $('#sheet').insertAdjacentHTML('beforeend',`<p class="lbl">💾 ${L('backup')}</p>
    <p class="info" style="margin:0">${S.lastBackup?L('lastBk',`${S.lastBackup} (${L('daysAgo',d)})`):L('never')}</p>
    ${needBk()?`<div class="bkw">${L('bkWarn')}</div>`:''}
    <button class="btn pri" id="bk-ex">${L('exportB')}</button>
    <button class="btn sec" id="bk-im">${L('importB')}</button>
    <button class="btn sec" id="bk-tx" ${S.words.length?'':'disabled'}>${L('wordsTxt')}</button>`);
  $('#bk-ex').onclick=exportBk;
  $('#bk-im').onclick=()=>pick.click();
  $('#bk-tx').onclick=wordsText;
};
$('#set').onclick=settings;
const baseRender=render;
render=function(){baseRender();$('#set').classList.toggle('warn',needBk())};
})();
</script>

</html>
